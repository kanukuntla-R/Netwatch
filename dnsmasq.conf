# Forward queries to Cloudflare + Google
server=1.1.1.1
server=8.8.8.8

# Listen on all interfaces
interface=eno1
bind-interfaces

# Cache size
cache-size=1000

# Log every query (this is what TraffWatch will see!)
log-queries
log-facility=/var/log/dnsmasq.log

# Don't read /etc/resolv.conf
no-resolv

# Don't poll for changes
no-poll

# Local domain
domain=local
expand-hosts

# Firefox checks this before enabling its built-in Cloudflare DoH; NXDOMAIN
# tells it to stay on the system resolver. https://support.mozilla.org/kb/canary-domain-use-application-dnsnet
address=/use-application-dns.net/
